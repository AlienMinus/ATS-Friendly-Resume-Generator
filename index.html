<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Viewer & Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link id="dynamic-favicon" rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">
    <link rel="stylesheet" href="static/style-fixed.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-900 h-screen overflow-hidden flex">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 w-64 bg-gray-900 text-white transform -translate-x-full transition-transform duration-300 lg:translate-x-0 lg:static lg:inset-auto flex flex-col h-full shadow-2xl no-print">
        <div class="p-6 border-b border-gray-800">
            <h1 class="text-xl font-bold tracking-wider"><i class="fa-solid fa-id-card mr-2"></i>ResuManager</h1>
        </div>
        
        <div class="flex-1 overflow-y-auto py-4">
            <div class="px-4 mb-2 text-xs font-semibold text-gray-500 uppercase tracking-wider">Profiles</div>
            <ul id="profile-list" class="space-y-1">
                <!-- Profiles injected here via JS -->
            </ul>
        </div>

        <div class="p-4 border-t border-gray-800">
            <button id="btn-new-profile" class="w-full text-left px-4 py-2 rounded hover:bg-gray-800 transition mb-1 text-sm text-green-400">
                <i class="fa-solid fa-plus mr-2"></i> New Profile
            </button>
            <button id="btn-show-resume" class="w-full text-left px-4 py-2 rounded hover:bg-gray-800 transition mb-1 text-sm">
                <i class="fa-solid fa-eye mr-2"></i> View Resume
            </button>
            <button id="btn-show-admin" class="w-full text-left px-4 py-2 rounded hover:bg-gray-800 transition text-sm text-blue-400">
                <i class="fa-solid fa-pen-to-square mr-2"></i> Edit / Admin
            </button>
        </div>
    </aside>

    <!-- Mobile Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-20 hidden lg:hidden glass"></div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 h-full overflow-y-auto relative w-full">
        
        <!-- Sidebar Toggle Button (Mobile) -->
        <button id="sidebar-toggle" class="absolute top-4 left-4 z-20 text-gray-600 hover:text-gray-900 lg:hidden p-2 bg-white/80 backdrop-blur rounded shadow-md transition">
            <i class="fa-solid fa-bars text-xl"></i>
        </button>
        
        <!-- RESUME VIEW -->
        <div id="resume-view" class="min-h-full p-4 md:p-8 flex flex-col items-center pt-16 lg:pt-8">
            <div class="no-print w-full max-w-[210mm] flex justify-end mb-4">
                <button id="print-btn" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 transition text-sm font-bold">
                    <i class="fa-solid fa-print mr-2"></i> Print PDF
                </button>
            </div>

            <!-- The Resume Page Container -->
            <div class="resume-page">
                <header id="header-section" class="text-center mb-3"></header>
                <section id="summary-section"></section>
                <section id="education-section"></section>
                <section id="skills-section"></section>
                <section id="experience-section"></section>
                <section id="projects-section"></section>
                <section id="certifications-section"></section>
                <section id="achievements-section"></section>
                <section id="custom-sections-container"></section>
            </div>
        </div>

        <!-- ADMIN VIEW (Hidden by default) -->
        <div id="admin-view" class="hidden min-h-full p-4 md:p-8 bg-gray-50 pt-16 lg:pt-8">
            <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-lg p-8">
                <div class="flex justify-between items-center mb-6 border-b pb-4">
                    <h2 class="text-2xl font-bold text-gray-800">Resume Data Editor</h2>
                    <div class="flex gap-3">
                        <button id="btn-duplicate-profile" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700 font-bold shadow text-sm">
                            <i class="fa-solid fa-copy mr-2"></i> Duplicate
                        </button>
                        <button id="btn-delete-profile" class="hidden bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 font-bold shadow text-sm">
                            <i class="fa-solid fa-trash mr-2"></i> Delete
                        </button>
                        <button id="btn-save-preview" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-bold shadow text-sm">
                            <i class="fa-solid fa-floppy-disk mr-2"></i> Save
                        </button>
                        <button id="btn-download-json" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 font-bold shadow text-sm">
                            <i class="fa-solid fa-download mr-2"></i> JSON
                        </button>
                    </div>
                </div>

                <form id="admin-form" class="space-y-6">
                    <!-- Form content injected via JS -->
                </form>
            </div>
        </div>

    </main>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-lg p-6 max-w-sm w-full shadow-xl">
            <h3 class="text-lg font-bold text-gray-900 mb-2">Delete Profile?</h3>
            <p class="text-gray-600 mb-6">Are you sure you want to delete this profile? This action cannot be undone.</p>
            <div class="flex justify-end gap-3">
                <button id="btn-cancel-delete" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded font-medium">Cancel</button>
                <button id="btn-confirm-delete" class="px-4 py-2 bg-red-600 text-white hover:bg-red-700 rounded font-bold shadow">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script src="static/script.js"></script>
</body>
</html>
